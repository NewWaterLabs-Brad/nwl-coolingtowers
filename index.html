<script>
(function(){
var SALT="7e8ba639bf29090225b325cc5e54b1d8", ITER=600000, KEYNAME="nwl-key", TITLE="Cooling tower mist capture";
var el=document.getElementById("payload");
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function hex(s){var u=new Uint8Array(s.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(s.substr(i*2,2),16);return u;}
function toB64(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
async function derive(pass){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hex(SALT),iterations:ITER},base,256);
}
async function open(raw,typed){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var data=b64(el.textContent.trim());
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:data.slice(0,12)},key,data.slice(12));
  var stored=false;
  try{sessionStorage.setItem(KEYNAME,SALT+":"+toB64(raw));stored=sessionStorage.getItem(KEYNAME)!==null;}catch(e){}
  if(el.dataset.kind==="pdf"){show(plain);return;}
  // A document written while Chrome still handles the click on Open keeps stale
  // mouse state, and its range sliders then do not drag. Reload instead, so the
  // remembered key opens the page with no click in progress.
  if(typed&&stored){location.reload();return;}
  var text=new TextDecoder().decode(plain);
  document.open();document.write(text);document.close();
}
function show(plain){
  var url=URL.createObjectURL(new Blob([plain],{type:"application/pdf"}));
  document.body.innerHTML="";
  document.body.style.margin="0";
  var bar=document.createElement("div");
  bar.style.cssText="padding:8px 16px;font:14px ui-sans-serif,system-ui,sans-serif";
  var a=document.createElement("a");a.href=url;a.download=el.dataset.name;a.textContent="Download the PDF";
  bar.appendChild(a);
  var f=document.createElement("iframe");f.src=url;f.title=TITLE;
  document.title=f.title+", New Water Labs";
  f.style.cssText="display:block;border:0;width:100%;height:calc(100vh - 40px)";
  document.body.appendChild(bar);document.body.appendChild(f);
}
var cached=null;
try{cached=sessionStorage.getItem(KEYNAME);}catch(e){}
if(cached&&cached.split(":")[0]===SALT){
  // Hide the box while the remembered key is tried. Replace the document only
  // after parsing ends, or document.write appends to the lock page instead.
  var form=document.getElementById("f");form.style.visibility="hidden";
  var go=function(){open(b64(cached.split(":")[1]).buffer).catch(function(){
    try{sessionStorage.removeItem(KEYNAME);}catch(e){}form.style.visibility="";});};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();
}
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();
  var b=document.getElementById("b"),m=document.getElementById("msg");
  // Browsers expose decryption only on https pages, so say that, not "wrong passphrase".
  if(!window.crypto||!crypto.subtle){m.textContent="This page opens only over https. Use https://"+location.host+location.pathname;return;}
  b.disabled=true;m.textContent="";
  var key;
  try{key=await derive(document.getElementById("p").value.trim());}
  catch(e){m.textContent="This browser could not process the passphrase.";b.disabled=false;return;}
  try{await open(key,true);}
  catch(e){m.textContent="That passphrase does not open this document.";b.disabled=false;}
});
})();
